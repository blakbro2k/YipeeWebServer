<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yipee Lobby</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
      --code-bg: #020617;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: var(--bg);
      color: var(--text);
    }

    h1 { margin-bottom: 0.5rem; }
    h2 { margin-top: 0; }

    .step {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    input, select, button, textarea {
      padding: 0.6rem 0.7rem;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
    }

    button {
      cursor: pointer;
      background: var(--panel-2);
    }

    button:hover {
      filter: brightness(1.08);
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
    }

    #log {
      background: var(--code-bg);
      color: #86efac;
      padding: 0.75rem;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.8rem;
      max-height: 250px;
      overflow: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tables-controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .tables-wrapper {
      max-height: 420px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem;
      background: #0b1220;
    }

    .tables-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      border: 1px solid var(--border);
    }

    .tables-table th,
    .tables-table td {
      padding: 0.4rem 0.5rem;
      vertical-align: top;
      border: 1px solid var(--border);
    }

    .table-number-cell {
      white-space: nowrap;
      font-weight: 600;
    }

    .watch-btn {
      font-size: 0.8rem;
      padding: 0.45rem 0.65rem;
      width: 100%;
    }

    .seats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.35rem;
    }

    .seat-btn {
      width: 100%;
      font-size: 0.8rem;
      padding: 0.5rem 0.4rem;
      box-sizing: border-box;
      text-align: left;
      min-height: 56px;
      line-height: 1.25;
    }

    .seat-btn.occupied {
      opacity: 0.78;
      cursor: not-allowed;
      font-weight: 600;
      background: #0f2418;
      border-color: #166534;
    }

    .seat-btn.mine {
      outline: 2px solid var(--accent-2);
      outline-offset: 1px;
    }

    .watchers-list {
      font-size: 0.8rem;
      max-width: 180px;
      word-wrap: break-word;
      color: var(--muted);
    }

    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .debug-header h2 {
      margin: 0;
    }

    .small-button {
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
    }

    .inline-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
  </style>
</head>
<body>

<h1>Yipee Lobby</h1>

<div class="step">
  <h2>Player Identity</h2>
  <input id="username-input" placeholder="username"/>
  <input id="rating-input" placeholder="rating"/>
  <input id="icon-input" placeholder="icon"/>
  <button id="register-btn">Register</button>
  <div id="register-status" class="muted"></div>
</div>

<div class="step">
  <h2>Player</h2>
  <button id="whoami-btn">Who Am I</button>
  <span id="whoami-label" class="muted"></span>
  <div class="muted" id="ids-label"></div>
</div>

<div class="step">
  <h2>Room</h2>
  <select id="room-select"></select>
  <div class="inline-row">
    <button id="join-room-btn">Join Room</button>
    <button id="refresh-rooms-btn">Refresh Rooms</button>
  </div>
  <span id="room-status" class="muted"></span>
</div>

<div class="step">
  <h2>Tables</h2>
  <div class="tables-controls">
    <button id="load-tables-btn">Load Tables</button>
    <button id="play-now-btn">Play Now</button>
    <button id="create-table-btn">Create Table</button>
  </div>
  <div id="tables-wrapper" class="tables-wrapper">
    <table class="tables-table">
      <tbody id="tables-body"></tbody>
    </table>
  </div>
  <div id="tables-status" class="muted"></div>
</div>

<div class="step">
  <div class="debug-header">
    <h2>Debug Log</h2>
    <button id="clear-log-btn" class="small-button">Clear Logs</button>
  </div>
  <pre id="log"></pre>
  <div>
    <button id="clear-cookies-btn" class="small-button">Clear Cookies</button>
  </div>
</div>

<script>
  const USERNAME_KEY   = "yipee.username";
  const RATING_KEY     = "yipee.rating";
  const ICON_KEY       = "yipee.icon";
  const PLAYER_ID_KEY  = "yipee.playerId";
  const SESSION_KEY    = "yipee.sessionId";
  const TOKEN_KEY      = "yipee.jwt";

  let currentRoomId = null;
  let authToken = null;
  let sessionId = localStorage.getItem(SESSION_KEY) || null;
  let currentPlayerId = localStorage.getItem(PLAYER_ID_KEY) || null;
  let currentSeatedTableId = null;
  let currentSeatedSeatNumber = null;

  const API_BASE = "http://localhost:8080";

  const usernameInput = document.getElementById("username-input");
  const ratingInput = document.getElementById("rating-input");
  const iconInput = document.getElementById("icon-input");
  const registerBtn = document.getElementById("register-btn");
  const registerStatus = document.getElementById("register-status");
  const whoamiBtn = document.getElementById("whoami-btn");
  const whoamiLabel = document.getElementById("whoami-label");
  const idsLabel = document.getElementById("ids-label");
  const roomSelect = document.getElementById("room-select");
  const joinRoomBtn = document.getElementById("join-room-btn");
  const refreshRoomsBtn = document.getElementById("refresh-rooms-btn");
  const roomStatus = document.getElementById("room-status");
  const loadTablesBtn = document.getElementById("load-tables-btn");
  const playNowBtn = document.getElementById("play-now-btn");
  const createTableBtn = document.getElementById("create-table-btn");
  const tablesBody = document.getElementById("tables-body");
  const tablesStatus = document.getElementById("tables-status");
  const clearLogBtn = document.getElementById("clear-log-btn");
  const clearCookiesBtn = document.getElementById("clear-cookies-btn");
  const logEl = document.getElementById("log");

  function launchGame(data) {
    const baseUrl = "http://localhost:8080/client/index.html";

    const params = new URLSearchParams({
        launchToken: data.launchToken,
        apiToken: authToken,
        clientId: getClientId(),
        sessionId: sessionId
    });

    const url = baseUrl + "?" + params.toString();

    window.open(url, "_blank");
  }

  function log(msg, obj) {
    logEl.textContent += `[${new Date().toISOString()}] ${msg}\\n`;
    if (obj !== undefined) logEl.textContent += JSON.stringify(obj, null, 2) + "\\n";
    logEl.scrollTop = logEl.scrollHeight;
  }

  clearLogBtn.onclick = () => {
    logEl.textContent = "";
  };

  clearCookiesBtn.onclick = () => {
    localStorage.clear();
    location.reload();
  };

  function getClientId() {
    let cid = localStorage.getItem("yipeeClientId");
    if (!cid) {
      cid = "client:" + crypto.randomUUID();
      localStorage.setItem("yipeeClientId", cid);
    }
    return cid;
  }

  function setSessionId(id) {
    sessionId = id;
    if (id) localStorage.setItem(SESSION_KEY, id);
  }

  function isPublic(path) {
    return path.startsWith("/api/public/");
  }

  function updateIdsLabel() {
    idsLabel.textContent =
      `clientId=${getClientId()} \\n playerId=${currentPlayerId} \\n sessionId=${sessionId} \\n apiToken=${authToken}`;
  }

  function loadIdentityFromStorage() {
    const storedUsername = localStorage.getItem(USERNAME_KEY);
    const storedRating   = localStorage.getItem(RATING_KEY);
    const storedIcon     = localStorage.getItem(ICON_KEY);
    const storedToken    = localStorage.getItem(TOKEN_KEY);

    if (storedUsername) usernameInput.value = storedUsername;
    if (storedRating)   ratingInput.value   = storedRating;
    if (storedIcon)     iconInput.value     = storedIcon;
    if (storedToken)    authToken           = storedToken;
  }

  function saveIdentityToStorage() {
    localStorage.setItem(USERNAME_KEY, usernameInput.value || "");
    localStorage.setItem(RATING_KEY,   ratingInput.value || "");
    localStorage.setItem(ICON_KEY,     iconInput.value || "");
  }

  function setCurrentSeatContext(tableId, seatNumber) {
    currentSeatedTableId = tableId;
    currentSeatedSeatNumber = seatNumber;
    log("Seat context set", { tableId, seatNumber });
  }

  function syncIdentityFromProfile(profile) {
    currentPlayerId = profile.playerId;
    localStorage.setItem(PLAYER_ID_KEY, currentPlayerId);

    usernameInput.value = profile.name ?? "";
    ratingInput.value   = profile.rating ?? "";
    iconInput.value     = profile.icon ?? "";

    if (profile.sessionId) setSessionId(profile.sessionId);

    saveIdentityToStorage();
    updateIdsLabel();

    currentSeatedTableId = null;
    currentSeatedSeatNumber = null;
  }

  async function api(path, options = {}) {
    const headers = options.headers || {};
    headers["Content-Type"] = "application/json";

    if (!isPublic(path) && authToken) {
      headers["Authorization"] = "Bearer " + authToken;
    }

    headers["X-Client-Id"] = getClientId();
    if (sessionId) headers["X-Session-Id"] = sessionId;

    const res = await fetch(API_BASE + path, { ...options, headers });
    const txt = await res.text();
    let json = null;

    try {
      json = txt ? JSON.parse(txt) : null;
    } catch (e) {
      json = txt;
    }

    log(`${options.method || "GET"} ${path} → ${res.status}`, json);

    if (!res.ok) throw new Error(txt);
    return json;
  }

  async function doHandshake(pid) {
    const res = await api("/api/public/session/handshake", {
      method: "POST",
      body: JSON.stringify({ playerId: pid, clientId: getClientId() })
    });

    if (res.apiToken) {
      authToken = res.apiToken;
      localStorage.setItem(TOKEN_KEY, authToken);
    }

    setSessionId(res.sessionId || res.id);
    updateIdsLabel();
  }

  async function ensureSession() {
    if (!currentPlayerId) {
      currentPlayerId = localStorage.getItem(PLAYER_ID_KEY) || null;
    }

    if (!currentPlayerId) {
      log("No playerId available for handshake. Register first.");
      return;
    }

    if (!sessionId || !authToken) {
      await doHandshake(currentPlayerId);
    }
  }

  registerBtn.onclick = async () => {
    saveIdentityToStorage();

    const res = await api("/api/public/player/register", {
      method: "POST",
      body: JSON.stringify({
        playerName: usernameInput.value,
        rating: ratingInput.value,
        icon: iconInput.value,
        clientId: getClientId()
      })
    });

    syncIdentityFromProfile({
      playerId: res.playerId,
      name: res.name,
      rating: res.rating,
      icon: res.icon,
      sessionId: res.sessionId
    });

    await doHandshake(currentPlayerId);
    registerStatus.textContent = "Registered OK";
  };

  whoamiBtn.onclick = async () => {
    try {
      await ensureSession();

      const res = await api("/api/player/whoami", { method: "GET" });

      syncIdentityFromProfile({
        playerId: res.playerId,
        name: res.name,
        rating: res.rating,
        icon: res.icon,
        sessionId: res.sessionId
      });

      whoamiLabel.textContent = `You are ${res.name} (rating ${res.rating})`;
    } catch (err) {
      console.error(err);
      whoamiLabel.textContent = "No player profile found on server. Please register.";
    }
  };

  joinRoomBtn.onclick = async () => {
    await ensureSession();

    const roomId = roomSelect.value;
    if (!roomId) {
      roomStatus.textContent = "No room selected.";
      return;
    }

    await api(`/api/rooms/${encodeURIComponent(roomId)}/join`, {
      method: "POST",
      body: JSON.stringify({})
    });

    currentRoomId = roomId;
    roomStatus.textContent = "Joined";
  };

  playNowBtn.onclick = async () => {
    tablesStatus.textContent = "Pick a table and seat first, then press Start Game on that row.";
  };

  createTableBtn.onclick = async () => {
    await ensureSession();

    if (!currentRoomId) {
      tablesStatus.textContent = "Select a room first.";
      return;
    }

    await api(`/api/rooms/${encodeURIComponent(currentRoomId)}/table/create`, {
      method: "POST",
      body: JSON.stringify({
        rated: true,
        soundOn: true,
        accessType: "OPEN"
      })
    });

    await loadTables();
  };

  async function loadTables() {
    tablesStatus.textContent = "Loading tables…";
    tablesBody.innerHTML = "";

    await ensureSession();

    if (!currentRoomId) {
      tablesStatus.textContent = "Join or select a room first.";
      return;
    }

    try {
      const tables = await api(
        `/api/rooms/${encodeURIComponent(currentRoomId)}/tables`,
        { method: "GET" }
      );

      log("renderTables: received details", tables);
      renderTables(tables || []);
      tablesStatus.textContent = `Loaded ${tables ? tables.length : 0} table(s).`;
    } catch (err) {
      console.error(err);
      tablesStatus.textContent = "Failed to load tables (see log).";
    }
  }

  function getSeatSummary(seat) {
    return seat?.seatSummary || seat || {};
  }

  function getPlayerSummary(seat) {
    return seat?.playerSummary || seat?.player || {};
  }

  function getSeatNumberFromSummary(summary) {
    if (summary?.seatNumber != null) return Number(summary.seatNumber);
    if (summary?.seatIndex != null) return Number(summary.seatIndex);
    return null;
  }

  function getSeatOccupied(seat) {
    const ss = getSeatSummary(seat);
    const ps = getPlayerSummary(seat);
    return !!(ss?.occupied || ss?.playerId || ps?.playerId);
  }

  function getSeatPlayerName(seat) {
    const ss = getSeatSummary(seat);
    const ps = getPlayerSummary(seat);
    return ps?.name || ps?.playerName || ss?.playerName || ps?.playerId || ss?.playerId || "Unknown";
  }

  function renderTables(tableDetails) {
    tablesBody.innerHTML = "";

    if (!tableDetails || tableDetails.length === 0) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 4;
      td.textContent = "No tables available.";
      tr.appendChild(td);
      tablesBody.appendChild(tr);
      return;
    }

    const SEAT_RENDER_ORDER = [0, 2, 4, 6, 1, 3, 5, 7];

    tableDetails.forEach((detail, index) => {
      const table = detail.table || detail;
      const seats = detail.seats || [];
      const watchers = detail.watchers || [];
      const watcherNames = (watchers ?? []).map(w => w.name || w.playerName || w.playerId).filter(Boolean);

      const tableId =
        detail.tableId ||
        table.tableId ||
        table.id ||
        table.table?.id ||
        null;

      const tr = document.createElement("tr");

      const tdNumber = document.createElement("td");
      tdNumber.className = "table-number-cell";

      const tableNumber =
        table.tableNumber ??
        table.number ??
        (index + 1);

      tdNumber.textContent = "#" + tableNumber;
      tr.appendChild(tdNumber);

      const tdWatch = document.createElement("td");

      const watchBtn = document.createElement("button");
      watchBtn.type = "button";
      watchBtn.textContent = "Watch";
      watchBtn.className = "watch-btn";
      watchBtn.onclick = () => watchTable(detail);
      tdWatch.appendChild(watchBtn);

      const startBtn = document.createElement("button");
      startBtn.type = "button";
      startBtn.textContent = "Start Game";
      startBtn.className = "watch-btn";
      startBtn.style.display = "block";
      startBtn.style.marginTop = "0.25rem";
      startBtn.onclick = () => startGameForTable(detail);
      tdWatch.appendChild(startBtn);

      const occupiedCount = seats.filter(s => getSeatOccupied(s)).length;
      const totalSeats = seats.length || 8;

      const playersLabel = document.createElement("div");
      playersLabel.textContent = `Players: ${occupiedCount} / ${totalSeats}`;
      playersLabel.className = "muted";
      playersLabel.style.marginTop = "0.25rem";
      tdWatch.appendChild(playersLabel);

      tr.appendChild(tdWatch);

      const tdSeats = document.createElement("td");
      const grid = document.createElement("div");
      grid.className = "seats-grid";

      const seatMap = {};
      seats.forEach(seat => {
        const ss = getSeatSummary(seat);
        const seatNumber = getSeatNumberFromSummary(ss);
        if (seatNumber != null) {
          seatMap[seatNumber] = seat;
        }
      });

      SEAT_RENDER_ORDER.forEach(seatNum => {
        const seat = seatMap[seatNum] || {
          seatSummary: {
            seatNumber: seatNum,
            occupied: false,
            playerId: null
          },
          playerSummary: null
        };

        const ss = getSeatSummary(seat);
        const occupied = getSeatOccupied(seat);
        const displaySeatNum = (seatNum === 0) ? 1 : seatNum + 1;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seat-btn";

        if (occupied) {
          const name = getSeatPlayerName(seat);
          const ready = ss?.seatReady ?? ss?.ready ?? false;
          btn.textContent = `Seat ${displaySeatNum}: ${name}${ready ? " [Ready]" : ""}`;
          btn.classList.add("occupied");

          const playerId = ss?.playerId || getPlayerSummary(seat)?.playerId || null;
          if (playerId && currentPlayerId && playerId === currentPlayerId) {
            btn.classList.add("mine");
          }

          btn.disabled = true;
        } else {
          btn.textContent = `Seat ${displaySeatNum} (Empty)`;
          btn.onclick = () => sitAtSeat(detail, seatNum);
        }

        grid.appendChild(btn);
      });

      tdSeats.appendChild(grid);
      tr.appendChild(tdSeats);

      const tdWatchers = document.createElement("td");
      const watchersDiv = document.createElement("div");
      watchersDiv.className = "watchers-list";

      if (!watchers || watchers.length === 0) {
        watchersDiv.textContent = "None";
      } else {
        watchersDiv.textContent = watcherNames.join(", ");
      }

      tdWatchers.appendChild(watchersDiv);
      tr.appendChild(tdWatchers);

      tablesBody.appendChild(tr);

      if (!tableId) {
        log("renderTables: missing tableId in row", detail);
      }
    });
  }

  async function startGameForTable(detail) {
    await ensureSession();

    if (!currentSeatedTableId || currentSeatedSeatNumber == null) {
      alert("You must sit in a seat first, then click Start Game to get a launch token.");
      return;
    }

    const table = detail.table || detail;
    const rowTableId =
      detail.tableId ||
      table.tableId ||
      table.id ||
      null;

    if (rowTableId && rowTableId !== currentSeatedTableId) {
      alert("You are seated at a different table. Sit at a seat on this table first.");
      return;
    }

    try {
      const data = await api("/api/game/launch-token", {
        method: "POST",
        body: JSON.stringify({
          tableId: currentSeatedTableId,
          seatNumber: currentSeatedSeatNumber
        })
      });

      launchGame(data);

      //alert(
      //  "Launch Token (copy/paste into desktop client):\\n\\n" +
      //  data.launchToken +
      //  (data.expiresAt ? ("\\n\\nExpires: " + data.expiresAt) : "") +
       // (data.wsUrl ? ("\\nWS: " + data.wsUrl) : "")
      //);
    } catch (err) {
      console.error(err);
      alert("LaunchToken failed. See debug log.");
    }
  }

  async function watchTable(tableDetail) {
    await ensureSession();

    const table = tableDetail.table || tableDetail;
    const tableId =
      tableDetail.tableId ||
      table.tableId ||
      table.id ||
      null;

    const numberLabel =
      table.tableNumber ??
      table.number ??
      tableId ??
      "?";

    if (!tableId) {
      tablesStatus.textContent = "Cannot watch: unknown table id.";
      log("watchTable: missing tableId", tableDetail);
      return;
    }

    try {
      await api(`/api/tables/${encodeURIComponent(tableId)}/stand-up`, {
        method: "POST",
        body: JSON.stringify({})
      });

      tablesStatus.textContent = `Joined table ${numberLabel} as watcher.`;
      await loadTables();
    } catch (err) {
      console.error(err);
      tablesStatus.textContent = `Failed to watch table ${numberLabel}.`;
    }
  }

  async function sitAtSeat(tableDetail, seatNumber) {
    await ensureSession();

    const table = tableDetail.table || tableDetail;
    const tableId =
      tableDetail.tableId ||
      table.tableId ||
      table.id ||
      null;

    const number =
      table.tableNumber ??
      table.number ??
      tableId ??
      "?";

    if (!tableId) {
      tablesStatus.textContent = "Cannot sit: unknown table id.";
      log("sitAtSeat: missing tableId in tableDetail", tableDetail);
      return;
    }

    try {
      const res = await api(`/api/tables/${encodeURIComponent(tableId)}/sit-down`, {
        method: "POST",
        body: JSON.stringify({
          seatNumber: seatNumber
        })
      });

      log("sitDown response", res);

      setCurrentSeatContext(tableId, seatNumber);
      tablesStatus.textContent = `Sat at seat ${seatNumber} on table ${number}.`;

      await loadTables();
    } catch (err) {
      console.error(err);
      tablesStatus.textContent = `Failed to sit at seat ${seatNumber} on table ${number}.`;
    }
  }

  async function standUpFromTable(tableDetail) {
    await ensureSession();

    const table = tableDetail.table || tableDetail;
    const tableId =
      tableDetail.tableId ||
      table.tableId ||
      table.id ||
      null;

    const numberLabel =
      table.tableNumber ??
      table.number ??
      tableId ??
      "?";

    if (!tableId) {
      tablesStatus.textContent = "Cannot stand up: unknown table id.";
      log("standUpFromTable: missing tableId in tableDetail", tableDetail);
      return;
    }

    try {
      const res = await api(`/api/tables/${encodeURIComponent(tableId)}/stand-up`, {
        method: "POST",
        body: JSON.stringify({})
      });

      log("standUp response", res);
      tablesStatus.textContent = `Stood up from table ${numberLabel}.`;

      currentSeatedTableId = null;
      currentSeatedSeatNumber = null;

      await loadTables();
    } catch (err) {
      console.error(err);
      tablesStatus.textContent = `Failed to stand up from table ${numberLabel}.`;
    }
  }

  async function refreshWhoAmI() {
    const res = await api("/api/player/whoami", { method: "GET" });

    currentPlayerId = res.playerId;
    localStorage.setItem(PLAYER_ID_KEY, currentPlayerId);

    if (res.apiToken) {
      authToken = res.apiToken;
      localStorage.setItem(TOKEN_KEY, authToken);
    }

    if (res.sessionId) setSessionId(res.sessionId);
    updateIdsLabel();
    return res;
  }

  async function loadRooms() {
    roomStatus.textContent = "Loading rooms…";
    await ensureSession();

    try {
      const rooms = await api("/api/rooms", { method: "GET" });

      roomSelect.innerHTML = "";

      if (!rooms || rooms.length === 0) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "(no rooms available)";
        roomSelect.appendChild(opt);
        roomStatus.textContent = "No rooms available.";
        return;
      }

      rooms.forEach(room => {
        const opt = document.createElement("option");
        opt.value = room.id || room.roomId || room.name;
        opt.textContent = room.name || `Room ${opt.value}`;
        roomSelect.appendChild(opt);
      });

      currentRoomId = roomSelect.value || null;
      roomStatus.textContent = "Rooms loaded.";
    } catch (err) {
      console.error(err);
      roomStatus.textContent = "Failed to load rooms.";
    }
  }

  refreshRoomsBtn.onclick = loadRooms;

  document.addEventListener("DOMContentLoaded", () => {
    loadIdentityFromStorage();
    authToken = authToken || localStorage.getItem(TOKEN_KEY) || null;
    updateIdsLabel();

    if (loadTablesBtn) loadTablesBtn.onclick = loadTables;
    if (refreshRoomsBtn) refreshRoomsBtn.onclick = loadRooms;
  });
</script>

</body>
</html>
